name: Publish Release
on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    env:
      SOLUTION: 'ManiaTemplates.sln'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Dependencies
        run: dotnet restore $SOLUTION
      
      - name: Build Solution
        run: dotnet build $SOLUTION --configuration Release -p:Version=${{github.ref_name}} --no-restore
        
      - name: Run Tests
        run: dotnet test $SOLUTION /p:Configuration=Release --verbosity normal
      
      - name: Nuget Pack
        run: dotnet pack $SOLUTION /p:Version=${{github.ref_name}} -c Release --no-build --output package/
      
      - name: ZIP Artifacts
        uses: papeloto/action-zip@v1
        with:
            files: package/
            dest: package.zip
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ github.workspace }}/package.zip
            
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

      # Push the package
      - name: NuGet Publish
        run: dotnet nuget push "package/ManiaTemplates.${{github.ref_name}}.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
